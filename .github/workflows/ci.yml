# CI workflow for Atnlyze WAF
#This workflow runs on push and pull request events to ensure code quality.
# It checks out the code, sets up Python, installs dependencies, and runs tests.
#This is for automated continuous integration.
name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run tests
        run: |
          pytest -q

      - name: Lint
        run: |
          pip install flake8
          flake8 src tests
            
