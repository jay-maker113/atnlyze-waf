name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Sanity imports
        env:
          PYTHONPATH: src
        run: |
          python -c "import atnlyze; print('atnlyze import ok')"
          python -c "import fastapi, httpx; print('fastapi/httpx import ok')"
          python -c "import torch; print('torch ok')"
          python -c "import sklearn; print('sklearn ok')"

      - name: Run CI-safe tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/unit/test_parser.py tests/unit/test_tokenizer.py -q

      - name: Lint
        env:
          PYTHONPATH: src
        run: |
          flake8 src tests --max-line-length=120 --extend-ignore=E501

